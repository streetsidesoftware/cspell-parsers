name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [22.x, 26.x]
        os:
          - ubuntu-latest
        include:
          - os: windows-latest
            node-version: 26.x

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        if: runner.os != 'Windows'
        run: pnpm test

      # @cspell/parser-typescript-tree-sitter (the raw native tree-sitter bindings) intermittently fails on
      # windows-latest - see docs/debugging/workflows/windows-ci-tree-sitter-flake.md. @cspell/parser-typescript
      # is backed by @cspell/parser-typescript-tree-sitter-wasm instead, so it and
      # @internal/test-packages-typescript's harness (minus the raw native module) are unaffected. The
      # dedicated Typecheck step above still covers every package in full; only the raw native package's
      # runtime tests are skipped here.
      - name: Test (excludes the native tree-sitter package on Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter '!@cspell/parser-typescript-tree-sitter' --filter '!@internal/test-packages-typescript' -r run test

      - name: Test typescript sample against non-native parsers only (Windows)
        if: runner.os == 'Windows'
        working-directory: test-packages/typescript
        run: node exec-test.mts --module @cspell/parser-typescript --module @cspell/parser-typescript-tree-sitter-wasm
